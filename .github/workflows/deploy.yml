name: CI/CD Blue-Green Deployment

# El pipeline se dispara cada vez que se hace un 'push' a la rama principal
on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite ejecutar el pipeline manualmente desde la interfaz de GitHub
    inputs:
      action_type:
        description: 'Selecciona el tipo de despliegue'
        required: true
        default: 'full_release'
        type: choice
        options:
          - full_release       # 1. Despliega la nueva versión y conmuta el tráfico
          - deploy_preview     # 2. Despliega en standby pero NO conmuta el tráfico
          - promote_production # 3. Solo conmuta el tráfico (Paso a producción de la preview)
          - rollback           # 4. Botón de rollback para volver a la versión anterior

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      # ---------------------------------------------------------
      # FASE 1: BUILD & PUSH (Se salta si es Rollback o Promote)
      # ---------------------------------------------------------
      - name: Iniciar sesión en Docker Hub
        if: github.event_name == 'push' 
            || github.event.inputs.action_type == 'full_release' 
            || github.event.inputs.action_type == 'deploy_preview'
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Construir y Subir la nueva imagen
        if: github.event_name == 'push' 
            || github.event.inputs.action_type == 'full_release' 
            || github.event.inputs.action_type == 'deploy_preview'
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/app-demo:${{ github.sha }} ./app-demo
          docker push ${{ secrets.DOCKER_USERNAME }}/app-demo:${{ github.sha }}

      # ---------------------------------------------------------
      # FASE 2: DETECCIÓN (Se ejecuta SIEMPRE)
      # ---------------------------------------------------------
      - name: Detectar el entorno activo actual
        id: slot
        run: |
          # Buscamos nuestra cabecera personalizada y extraemos su valor (blue o green)
          CURRENT_ENV=$(curl -s -k -I https://tfg-arso.local | grep -i "X-Active-Env:" | awk '{print $2}' | tr -d '\r')
          
          echo "El proxy informa que el entorno activo es: $CURRENT_ENV"

          if [[ "$CURRENT_ENV" == "blue" ]]; then
            echo "STANDBY=green" >> $GITHUB_ENV
          elif [[ "$CURRENT_ENV" == "green" ]]; then
            echo "STANDBY=blue" >> $GITHUB_ENV
          else
            echo "ERROR: No se detectó la cabecera X-Active-Env. (Recibido: '$CURRENT_ENV')"
            exit 1
          fi

      # ---------------------------------------------------------
      # FASE 3: DESPLIEGUE (Se salta si es Rollback o Promote)
      # ---------------------------------------------------------
      - name: Desplegar la nueva versión en el entorno inactivo (Standby)
        if: github.event_name == 'push' 
            || github.event.inputs.action_type == 'full_release' 
            || github.event.inputs.action_type == 'deploy_preview'
        working-directory: ${{ vars.PROJECT_PATH }}
        env:
          TARGET_ENV: ${{ env.STANDBY }}
          APP_IMAGE: "${{ secrets.DOCKER_USERNAME }}/app-demo:${{ github.sha }}"
        run: |
          # AVISO: Se especifica la máquina destino (vm-blue o vm-green) para no pisar el cluster entero
          TARGET_ENV=${{ env.STANDBY }} APP_IMAGE="${{ env.APP_IMAGE }}" vagrant provision vm-${{ env.STANDBY }} --provision-with ansible

      - name: Ejecutar Health Check en el nuevo entorno
        if: github.event_name == 'push' 
            || github.event.inputs.action_type == 'full_release' 
            || github.event.inputs.action_type == 'deploy_preview'
        run: |
          if [ "${{ env.STANDBY }}" == "green" ]; then
            CHECK_IP="10.0.0.12"
          else
            CHECK_IP="10.0.0.11"
          fi
          
          echo "Haciendo ping a $CHECK_IP..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" http://$CHECK_IP)
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Health check falló (Estado: $HTTP_STATUS)."
            exit 1 
          fi
          echo "Health check superado!"

      # ---------------------------------------------------------
      # FASE 4: CONMUTAR TRÁFICO (Se salta en deploy_preview)
      # ---------------------------------------------------------
      - name: Conmutar el tráfico en el Nginx Proxy (Switch)
        if: github.event_name == 'push' 
            || github.event.inputs.action_type == 'full_release'
            || github.event.inputs.action_type == 'promote_production' 
            || github.event.inputs.action_type == 'rollback'
        working-directory: ${{ vars.PROJECT_PATH }}
        run: |
          # Tanto si promovemos la preview como si hacemos rollback, el objetivo siempre es
          # enviar el tráfico al entorno que actualmente está marcado como STANDBY.
          # AVISO: Apuntamos exclusivamente a vm-proxy.
          TARGET_ENV=${{ env.STANDBY }} vagrant provision vm-proxy --provision-with ansible