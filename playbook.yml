---
# ============================================================
# BLOQUE 1: Configuración del Proxy (Punto de entrada)
# ============================================================
- name: Configure VM-Proxy with Nginx
  hosts: vm-proxy
  become: yes
  vars:
    nginx_user: www-data
    nginx_port: 80
    target_env: "blue"
    env_ips:
      blue: "10.0.0.11"
      green: "10.0.0.12"
    backend_ip: "{{ env_ips[target_env] }}"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes 
        cache_valid_time: 3600
    - name: Install Nginx
      apt:
        name: nginx
        state: present
    - name: Start Nginx service
      service:
        name: nginx
        state: started
        enabled: yes
    - name: Copy reverse proxy configuration
      template:
        src: default.conf.j2
        dest: /etc/nginx/sites-available/default
    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded

# ============================================================
# BLOQUE 2: Infraestructura Base (Común a ambos entornos)
# ============================================================
- name: Preparar Infraestructura Docker en Nodos de Aplicación
  hosts:
    - vm-blue
    - vm-green
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
    - name: Install Docker
      apt:
        name: docker.io
        state: present
    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes
    - name: Añadir el usuario vagrant al grupo docker
      user:
        name: vagrant
        groups: docker
        append: yes

# ============================================================
# BLOQUE 3: Despliegue de Aplicación (Específico Blue-Green)
# ============================================================
- name: Desplegar Contenedor de Aplicación (Aislamiento de entorno)
  # Usamos la variable dinámica. Si no se recibe, aplica a ambos por seguridad en local.
  hosts: "{{ target_env_hosts | default('vm-blue,vm-green') }}"
  become: yes
  tasks:
    - name: Desplegar el contenedor de la aplicación
      community.general.docker_container:
        name: app-container
        # Prioriza la imagen del pipeline, si no, usa el placeholder
        image: "{{ app_image | default('nginx:alpine') }}"
        state: started
        restart_policy: always
        published_ports:
          - 80:80
        pull: yes