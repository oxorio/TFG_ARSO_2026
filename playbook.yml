---
- name: Configure VM-Proxy with Nginx
  hosts: vm-proxy
  become: yes
  vars:
    nginx_user: "www-data"
    nginx_port: 80

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Start Nginx service
      service:
        name: nginx
        state: started
        enabled: yes
    
    - name: Verify Nginx is running
      service_facts:
      register: services

    - name: Display Nginx status
      debug:
        msg: "Nginx is {{ services.ansible_facts.services['nginx.service'].state }}"

- name: Install Docker on VMs
  hosts:
    - vm-blue
    - vm-green
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Añadir el usuario vagrant al grupo docker (para evitar usar sudo docker)
      user:
        name: vagrant
        groups: docker
        append: yes
    
